<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Roll a Review 🎲</title>
<meta name="description" content="Roll the dice, get a review, copy it." />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<main class="stage">
  <p class="eyebrow">tradewzrd · review roller</p>

  <button id="dice" aria-label="Roll the dice">⚄</button>
  <p class="hint">tap the dice to roll a review</p>
  <p class="count"><span id="left">50</span> left in this deck</p>

  <section id="card" hidden>
    <div class="stars" id="stars"></div>
    <p id="text"></p>
    <div class="row">
      <span id="name"></span>
      <button id="copy">⧉ copy review</button>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
